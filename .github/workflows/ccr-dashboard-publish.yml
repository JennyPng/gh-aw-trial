# CCR dashboard publish (ACTIVE).
#
# Purpose: commit the read-only CCR Improvement Loop's run JSON into the committed
# dashboard data folder so GitHub Pages can serve up-to-date trends. This keeps the
# agentic loop itself read-only — publishing is a separate, plain (non-agent)
# workflow.
#
# STATUS: active. Runs automatically after each successful "CCR Improvement Loop"
# run (workflow_run) and commits fresh run-*.json to the default branch; the
# "tools - ccr-dashboard-pages" workflow then auto-deploys the updated dashboard.
# Also runnable manually via workflow_dispatch.
#
# NOTE: workflow_run + push-to-default-branch only take effect once these
# workflows are committed to the repository's DEFAULT branch.
#
# Token: same-repo publish uses the built-in GITHUB_TOKEN (contents: write). No
# PAT / GitHub App / deploy key is required.
name: "tools - ccr-dashboard-publish"

on:
  workflow_dispatch: {}
  # Auto-publish after each loop run: fires when "CCR Improvement Loop"
  # completes. The job below only proceeds on a successful conclusion.
  workflow_run:
    workflows: ["CCR Improvement Loop"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: ccr-dashboard-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # When activated via workflow_run, only publish on a successful loop run.
    # (No-op for workflow_dispatch, where github.event.workflow_run is null.)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      DATA_DIR: .github/aw/ccr-improvement-loop/dashboard/data
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Download run JSON artifact(s) from the loop
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # No `name`: gh-aw uploads run-*.json under a dynamic artifact name, so
          # pull EVERY artifact from the triggering loop run and let the copy step
          # below find run-*.json wherever it landed. On workflow_run, run-id +
          # token point at the loop run; on manual dispatch both are empty (no
          # source run) and this simply downloads nothing.
          path: ${{ runner.temp }}/ccr-runs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Copy run JSON into the committed data folder
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR"
          found=0
          if [ -d "${RUNNER_TEMP}/ccr-runs" ]; then
            while IFS= read -r -d '' f; do
              cp "$f" "$DATA_DIR/"
              found=$((found + 1))
            done < <(find "${RUNNER_TEMP}/ccr-runs" -type f -name 'run-*.json' -print0)
          fi
          echo "copied $found run file(s) into $DATA_DIR"

      - name: Regenerate data/manifest.json
        run: |
          node -e '
            const fs = require("node:fs");
            const dir = process.env.DATA_DIR;
            // run.id is the canonical window identity, so filenames look like
            // run-<owner>_<repo>__<start>__<end>__<cohort>__raw<ver>.json (with
            // "__" separators and a dot in the version). The run-*.json glob and
            // this regex match those basenames unchanged.
            const runs = fs.readdirSync(dir)
              .filter((f) => /^run-.*\.json$/.test(f))
              .sort();
            fs.writeFileSync(
              dir + "/manifest.json",
              JSON.stringify({ runs }, null, 2) + "\n",
            );
            console.log("manifest lists", runs.length, "run(s)");
          '

      - name: Commit and push if data changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DATA_DIR"
          if git diff --cached --quiet; then
            echo "no dashboard data changes to commit"
            exit 0
          fi
          git commit -m "chore(ccr-dashboard): publish latest run data"
          git push
